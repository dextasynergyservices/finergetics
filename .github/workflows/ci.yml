name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a new push to the PR cancels the older run

permissions:
  contents: read             # least privilege for the default GITHUB_TOKEN

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun audit --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-67mh-4wv8-2f99
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"
          BETTER_AUTH_SECRET: "ci-build-mock-secret-at-least-32-chars-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}